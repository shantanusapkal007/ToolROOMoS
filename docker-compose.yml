services:
  # -----------------------------------------------------
  # 1. DATABASE LAYER
  # -----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: toolroomos-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: toolroomos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d toolroomos"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: toolroomos-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -----------------------------------------------------
  # 2. APPLICATION LAYER (DEVELOPMENT MODE)
  # -----------------------------------------------------
  backend:
    build:
      context: ./backend
      # We don't use the production target for dev
    container_name: toolroomos-backend
    ports:
      - "4000:4000"
      - "9229:9229" # Debug port
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@postgres:5432/toolroomos?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=toolroomos-dev-super-secret
      - PORT=4000
      - NODE_ENV=development
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: toolroomos-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

